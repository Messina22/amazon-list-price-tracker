name: Track prices

on:
  schedule:
    # Every day at 09:23 UTC (an off-peak, non-round minute to avoid the
    # GitHub Actions top-of-hour cron rush).
    - cron: "23 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: track-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record today's prices
        run: python -m price_tracker run

      # Runs on every daily run; the tracker itself decides whether today is a
      # send day (daily, or the weekday configured in config.yaml) and stays
      # quiet otherwise. A delivery failure must not lose the day's prices, so
      # this step never fails the job.
      - name: Send price-change notifications
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PRICE_TRACKER_WEBHOOK_URL: ${{ secrets.PRICE_TRACKER_WEBHOOK_URL }}
        run: python -m price_tracker notify

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No price changes to commit"
          else
            git commit -m "Record prices for $(date -u +%F)"
            git push
          fi
