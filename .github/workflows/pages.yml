name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - dashboard/**
      - data/**
      - price_tracker/**
      - config.yaml
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static dashboard
        run: python -m price_tracker build-dashboard --out _site

      # Creating a Pages site is a repo-admin action; GITHUB_TOKEN cannot
      # enable it. Skip publishing (don't fail the workflow) until Pages is
      # turned on at Settings → Pages → Source: GitHub Actions.
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled, so the dashboard was built but not published. Enable it at Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
