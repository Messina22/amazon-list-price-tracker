name: Tests

on:
  push:
    # The tracker's own commits only touch data/, and nothing under test reads
    # those files — no need to re-run the suite three dozen times a month.
    paths-ignore:
      - data/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -v
